<!doctype html>
<html lang="zh-CN" data-game-mode="classCards">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f2">
  <title>中考前六周 · 同班抉择沙盘</title>
  <link rel="stylesheet" href="styles.css?v=20260815-35">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="assets/exam-sheet.svg" alt="">
      <span class="brand-mark">中考前六周</span>
      <span class="brand-subtitle">同班抉择沙盘</span>
    </div>
    <div class="round-status" aria-live="polite">
      <span id="phaseLabel">人物准备</span>
      <strong id="roundLabel">第 1 / 6 周</strong>
    </div>
    <nav class="top-actions" aria-label="游戏控制">
      <button class="icon-button" id="storyButton" title="查看六周故事" aria-label="查看六周故事">▤</button>
      <button class="icon-button" id="saveButton" title="存档和读档" aria-label="存档和读档">▣</button>
      <button class="icon-button undo-button" id="undoButton" title="暂无可撤回操作" aria-label="暂无可撤回操作" disabled>↶</button>
      <button class="icon-button" id="helpButton" title="查看规则" aria-label="查看规则">?</button>
      <button class="icon-button danger" id="resetButton" title="重新开始" aria-label="重新开始">↻</button>
    </nav>
  </header>

  <main class="game-shell">
    <section class="event-panel" aria-labelledby="eventTitle">
      <div class="section-heading">
        <div>
          <span class="eyebrow" id="weekTheme">第一周 · 目标、作息和起点</span>
          <h1 id="eventTitle">六个人，同一间教室，六周倒计时</h1>
        </div>
        <div class="deck-counter"><span>本周牌堆</span><strong id="deckCount">6</strong><i>/ 6</i></div>
      </div>

      <button class="story-ribbon" id="storyRibbon" type="button">
        <span id="storyStage">序章 · 周一早读前</span>
        <strong id="storyChapter">倒计时写上黑板</strong>
        <i>阅读全文</i>
        <small id="storyLine">班主任放下六只档案袋，这不是六条互不相干的路线。</small>
      </button>

      <div class="draw-stage" id="drawStage" aria-live="polite">
        <div class="desk-lines" aria-hidden="true"></div>
        <div class="event-card back" id="eventCard">
          <div class="card-back-face">
            <span>中考前六周</span>
            <strong>?</strong>
            <small>同班事件</small>
          </div>
          <div class="card-front-face">
            <span class="card-symbol" id="cardSymbol">＊</span>
            <span class="card-meta" id="cardMeta">个人 · 机遇</span>
            <h2 id="cardTitle">等待抽卡</h2>
            <p id="cardPreview">翻开这一周落到当前学生面前的事件。</p>
          </div>
        </div>
        <div class="draw-copy">
          <span class="current-turn" id="currentTurn">准备阶段</span>
          <p id="drawHint">请先读完六位学生的档案，再开始第一周。</p>
          <button class="primary-button" id="drawButton">查看人物档案</button>
        </div>
      </div>

      <div class="last-event" id="lastEvent">
        <span>下一步</span>
        <p id="lastEventText">请先依次查看六位学生的人物档案。</p>
      </div>
    </section>

    <aside class="student-panel" aria-labelledby="currentStudentName">
      <div class="student-heading">
        <span class="student-avatar" id="studentAvatar">林</span>
        <div><span class="eyebrow">当前学生</span><h2 id="currentStudentName">林晓晨</h2></div>
        <button class="text-button" id="profileButton">查看档案</button>
      </div>
      <section class="sidebar-bonds" aria-labelledby="bondsTitle">
        <div class="sidebar-bonds-heading">
          <div><span class="eyebrow">固定关系网</span><h3 id="bondsTitle">搭档默契</h3></div>
          <small>达到2可支援</small>
        </div>
        <div class="bond-list" id="bondList"></div>
      </section>
      <p class="student-background" id="studentBackground"></p>
      <div class="student-facts">
        <span><strong>本周关注</strong><i id="studentGoal"></i></span>
        <span><strong>容易卡住</strong><i id="studentPressure"></i></span>
      </div>
      <div class="adult-relations" id="adultRelations"></div>
      <div class="resource-grid" id="resourceGrid"></div>
      <div class="status-line">
        <span class="condition-chip" id="conditionChip">状态稳定</span>
        <span id="actionProgress">本周第 1 / 6 位</span>
      </div>
      <div class="partner-focus" id="partnerFocus"></div>
    </aside>

    <section class="class-panel" aria-labelledby="classTitle">
      <div class="section-heading compact">
        <div><span class="eyebrow">同一个班</span><h2 id="classTitle">六位学生状态</h2></div>
        <span class="progress-copy" id="progressCopy">本周 0 / 6 人完成</span>
      </div>
      <div class="student-list" id="studentList"></div>
    </section>

  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <span class="modal-kicker" id="modalKicker">事件</span>
      <h2 id="modalTitle">标题</h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </div>

  <template id="resourceTemplate">
    <div class="resource-item">
      <span class="resource-icon"></span>
      <div><span class="resource-name"></span><strong class="resource-value"></strong></div>
      <span class="resource-max"></span>
    </div>
  </template>

  <script src="app.js?v=20260815-35"></script>
  <script src="card-game.js?v=20260815-35"></script>
</body>
</html>
